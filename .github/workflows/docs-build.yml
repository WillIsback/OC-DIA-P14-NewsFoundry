name: Docs Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "frontend/src/**"
      - ".github/workflows/docs-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "frontend/src/**"
      - ".github/workflows/docs-build.yml"
  # Redéploiement manuel de GitHub Pages (ex. après un renommage du dépôt).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Starlight docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # pnpm 11 refuse les scripts de build non approuvés (ERR_PNPM_IGNORED_BUILDS) :
      # on reste sur pnpm 10, compatible avec le lockfile v9 du site.
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
